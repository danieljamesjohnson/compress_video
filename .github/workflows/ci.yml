name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '.planning/**'
      - '**/*.md'
      - 'QUESTIONS.md'
      - '.mission-control/**'
  pull_request:
    paths-ignore:
      - '.planning/**'
      - '**/*.md'
      - 'QUESTIONS.md'
      - '.mission-control/**'
  workflow_dispatch:

# The repository's default Actions workflow token permission is already read-only
# (set in plan 01-01); this makes it explicit at the workflow level too.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the 10x-billed macOS job needs to run at all. A push/PR that only
  # touches Android or Dart-only paths skips it entirely.
  changes:
    name: Detect Apple-relevant changes
    runs-on: ubuntu-latest
    outputs:
      apple: ${{ steps.filter.outputs.apple }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine whether Apple-relevant paths changed
        id: filter
        run: |
          set -euo pipefail

          # workflow_dispatch has no meaningful push range to diff against; always run
          # the expensive job rather than guess.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "apple=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          # A first push on a new branch, or a force-push, reports an all-zero `before`
          # SHA; an unresolvable base is also possible after history rewrites. Both cases
          # deliberately fail OPEN (run the Apple job) rather than silently skipping it -
          # a broken base reference must never turn the Apple gate off.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "apple=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$BASE" "$HEAD" | grep -Eq '^(darwin/|pigeons/|lib/|example/|tool/|corpus/|pubspec\.yaml$|\.github/workflows/ci\.yml$)'; then
            echo "apple=true" >> "$GITHUB_OUTPUT"
          else
            echo "apple=false" >> "$GITHUB_OUTPUT"
          fi

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Verify no hand-written channel plumbing remains (BULD-03, success criterion 4)
        # Every quantity crossing the Dart/native boundary must be a Pigeon-generated field --
        # no hand-written channel map may remain anywhere in the package. Enumerates lib/,
        # android/src/main/, and darwin/compress_video/Sources/ for channel primitives OUTSIDE
        # the Pigeon-generated Messages.g.* files and fails, naming the offending file(s), if
        # any hand-written channel plumbing is found.
        #
        # Deliberately does NOT use `|| true` or any redirection that would hide grep's real
        # exit status: `set -e` is off for the grep line itself so a "no matches" (exit 1) does
        # not abort the script before this step can act on it, and the captured exit code is
        # branched on explicitly (0 = match found = fail; 1 = no match = pass; >1 = grep itself
        # errored = fail) so a false positive here is impossible to silently ignore.
        run: |
          PATTERN='MethodChannel|EventChannel|BasicMessageChannel|FlutterMethodChannel'
          set +e
          MATCHES=$(grep -RIln -E "$PATTERN" \
            lib/ android/src/main/ darwin/compress_video/Sources/ \
            --exclude='messages.g.dart' --exclude='Messages.g.kt' --exclude='Messages.g.swift')
          GREP_STATUS=$?
          set -e
          if [ "$GREP_STATUS" -eq 0 ]; then
            echo "FATAL: hand-written channel plumbing found outside the Pigeon-generated files:" >&2
            echo "$MATCHES" >&2
            exit 1
          elif [ "$GREP_STATUS" -gt 1 ]; then
            echo "FATAL: grep itself failed (exit $GREP_STATUS) while scanning for hand-written channel plumbing" >&2
            exit 1
          fi
          echo "No hand-written channel plumbing found outside Messages.g.*"

      - name: Regenerate the Pigeon contract and verify it matches committed output
        # Guards against the contract being hand-edited without regenerating, or the
        # generator being upgraded without recommitting its output. `dart format` runs
        # immediately after `pigeon` because Pigeon's own generator output is not
        # dart-format-clean (long lines, non-idiomatic wrapping) - the committed
        # lib/src/messages.g.dart is formatted, so this step must format too or the diff
        # below would be non-empty on every run, not just on real drift. The diff is
        # scoped to only the contract's own files: Flutter's project migrators can
        # rewrite analysis_options.yaml (see "Reset files..." below) the moment a newer
        # `flutter analyze` touches it, and an unscoped `git diff --exit-code` would fail
        # on that unrelated drift instead of on a real Pigeon contract mismatch.
        run: |
          dart run pigeon --input pigeons/messages.dart
          dart format lib/src/messages.g.dart
          git diff --exit-code -- \
            pigeons/messages.dart \
            lib/src/messages.g.dart \
            android/src/main/kotlin/com/danjjohnson/compress_video/Messages.g.kt \
            darwin/compress_video/Sources/compress_video/Messages.g.swift

      - name: Generate the example app's Android project files
        # example/android/gradlew is gitignored (Flutter's own template) - it only exists
        # locally because a previous `flutter build`/`flutter pub get` materialized it. On
        # a fresh CI checkout it does not exist yet, so calling ./gradlew directly in the
        # next step would fail with "No such file or directory". --config-only generates
        # the project files (including the wrapper) without building any artifacts.
        working-directory: example
        run: flutter build apk --config-only --debug

      - name: Run Android native unit tests
        working-directory: example/android
        run: ./gradlew :compress_video:testDebugUnitTest

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Free disk space for the emulator's userdata partition
        # The first real run failed with "FATAL | Not enough space to create userdata
        # partition. Available: 4498.95 MB ... need 7372.80 MB" - ubuntu-latest's default
        # free space is tight once Flutter, Gradle and the Android SDK/system image are
        # all installed. Remove large preinstalled toolchains this project never uses
        # (this plugin has no native .so/NDK code) to reclaim space, on top of shrinking
        # the requested partition size below.
        #
        # Deliberately NOT deleting $AGENT_TOOLSDIRECTORY (/opt/hostedtoolcache): the
        # first attempt at this fix removed it here, which also deletes the Flutter SDK
        # (subosito/flutter-action) and JDK (actions/setup-java) this same job already
        # set up and still needs for every step after this one -- the very next run
        # broke differently (sdkmanager's install calls silently no-opped and the
        # emulator's own pre-launch "kill any stale instance" adb call became fatal).
        # dotnet + the Android NDK alone are enough headroom for the ~2.9GB shortfall.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/share/boost || true
          df -h /

      - name: Run emulator integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -partition-size 2048
          # Captured with `tee` (not swallowed behind a bare pipe) so the step still shows the
          # full test log AND still fails when a test fails: `set -o pipefail` makes the step's
          # own exit status the `flutter test` exit status, not `tee`'s. Wrapped in a single
          # `bash -c` invocation because this action's `script` executes each line as its own
          # separate `sh -c` call (confirmed live: a bare multi-line block's `cd` never
          # persisted to the next line and dash's `sh` rejected `set -o pipefail` outright) --
          # one line, one bash subshell, is the only way `cd`/`set -o pipefail`/the pipe all
          # apply to the same process.
          # --timeout 120s matches tool/run_ios_integration_suites.sh: the suites run real encodes
          # and the 20 s default per-test timeout is a slow-runner lottery (see that script).
          script: bash -c 'cd example && set -o pipefail && flutter test integration_test --timeout 120s | tee /tmp/android_integration.log'

      - name: Extract cross-platform parity records (Android)
        # Captures the PARITY_JSON lines media_info_test.dart/thumbnail_test.dart emitted above,
        # for the `parity` job (01-07) to diff against the same records from the `apple` job.
        run: grep '^PARITY_JSON ' /tmp/android_integration.log > /tmp/parity-android.txt

      - name: Upload Android parity artifact
        uses: actions/upload-artifact@v4
        with:
          name: parity-android
          path: /tmp/parity-android.txt

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Verify corpus has not drifted
        run: bash corpus/verify_corpus.sh

      - name: Verify example corpus mirror matches canonical corpus
        run: |
          bash corpus/sync_to_example.sh
          git diff --exit-code example/assets/corpus

      - name: Run Dart unit tests
        run: flutter test

      - name: Reset files Flutter's own tooling may have rewritten
        # subosito/flutter-action tracks "stable", which moves forward independently of the
        # Flutter version docs/TOOLCHAIN.md pins for local development. Newer Flutter tooling
        # runs project migrators against older-shaped generated files (analysis_options.yaml,
        # Xcode project files, Podfiles) the moment it touches them, rewriting already-committed
        # files in the runner's working tree. That is harmless to every check above (they
        # already ran against whatever the migrated content was) but makes `dart pub publish
        # --dry-run` report a "checked-in files are modified in git" warning and exit non-zero.
        # This is an ephemeral CI checkout, not a shared worktree, so resetting tracked files to
        # HEAD here is safe and only affects this one validation step.
        run: git checkout -- .

      - name: Dry-run publish
        run: dart pub publish --dry-run

      - name: Build debug APK
        working-directory: example
        run: flutter build apk --debug

      - name: Verify the debug APK's native libraries and 16 KB page alignment (BULD-01, D-20)
        # The same script a developer runs locally after building. Enumerates every native
        # library entry in the archive against an explicit allowlist (never a denylist) and
        # runs zipalign's own 16 KB page-alignment verification. Also asserts, straight out of
        # the plugin's own build file, the minSdk/compileSdk this project is committed to and
        # that the media3 pin is still on the 1.11.x train doc/TOOLCHAIN.md's bump policy
        # requires.
        #
        # QUESTIONS.md item 6: if this CI run itself was refused because of the account's
        # billing/spending limit, that refusal is an external blocker to record in
        # QUESTIONS.md, NOT a failing check here -- the local emulator and this local script are
        # this phase's real gate. Do not retry a billing-refused run; record it and move on.
        run: |
          bash tool/verify_apk_native_libs.sh
          grep -c 'minSdk = 23' android/build.gradle.kts
          grep -c 'compileSdk = 36' android/build.gradle.kts
          grep -Ec 'media3-(transformer|effect|common|muxer):1\.11\.' android/build.gradle.kts

  apple:
    name: Apple
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.apple == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify RunnerTests.swift is identical on iOS and macOS
        # example/ios/RunnerTests/RunnerTests.swift and example/macos/RunnerTests/RunnerTests.swift
        # are the only files their respective XCTest targets compile (see 01-06-PLAN.md) and must
        # be kept byte-identical, so a rule proven on one Apple platform cannot silently diverge
        # on the other.
        run: diff example/ios/RunnerTests/RunnerTests.swift example/macos/RunnerTests/RunnerTests.swift

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Our plugin ships both a podspec and a Package.swift (sharedDarwinSource). Recent
      # Flutter defaults to treating an all-SPM-capable plugin set as reason to prefer Swift
      # Package Manager integration even when the app project still has CocoaPods integration
      # (a committed Podfile) - flutter build then reports "All plugins found for ios are Swift
      # Packages, but your project still has CocoaPods integration" and produces a
      # "sandbox is not in sync with the Podfile.lock" Xcode error. Force SPM off explicitly so
      # the CocoaPods-path builds below genuinely exercise CocoaPods, matching what the podspec
      # and committed Podfiles are meant to prove; the dedicated SPM step further down flips
      # this back on to prove that path separately.
      - name: Force CocoaPods integration for the CocoaPods-path builds
        run: flutter config --no-enable-swift-package-manager

      - name: Build iOS (CocoaPods)
        working-directory: example
        run: |
          set -euo pipefail
          # Flutter's project migrator can rewrite ios/Podfile and ios/Runner.xcodeproj on
          # first run against a newer stable than the one the template was generated from,
          # which can leave the just-migrated Podfile.lock out of sync with the CocoaPods
          # sandbox check ("The sandbox is not in sync with the Podfile.lock"). Retry once
          # after clearing the CocoaPods install state so the retry starts from a Podfile
          # and lockfile that were actually generated together.
          flutter build ios --simulator --no-codesign || {
            echo "::warning::iOS build failed, likely a CocoaPods sandbox/Podfile.lock mismatch from Flutter's project migration. Clearing Pods state and retrying once."
            rm -rf ios/Pods ios/Podfile.lock ios/.symlinks
            flutter build ios --simulator --no-codesign
          }

      - name: Resolve an available iOS simulator
        id: ios_sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '
                .devices
                | to_entries
                | map(select(.key | contains("iOS")))
                | map(.value) | flatten
                | map(select(.isAvailable))
                | .[0].udid // empty
              ')
          if [ -z "$UDID" ]; then
            echo "No available iOS simulator found on this runner image" >&2
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: XCTest - iOS Runner
        working-directory: example/ios
        run: |
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -destination "platform=iOS Simulator,id=${{ steps.ios_sim.outputs.udid }}"

      - name: Boot the iOS simulator for the corpus integration suite
        # xcodebuild's own test action above boots the simulator for the duration of that
        # run and may leave it shut down afterward; boot explicitly and wait for readiness so
        # `flutter test integration_test -d <udid>` below always has a running device to
        # attach to.
        run: |
          xcrun simctl boot "${{ steps.ios_sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.ios_sim.outputs.udid }}" -b

      - name: Run corpus integration tests on the iOS simulator
        # Runs the Phase 1 corpus suites (media_info_test.dart, thumbnail_test.dart) plus
        # compress_test.dart, compress_audio_test.dart, compress_jobs_test.dart (03-06: per-job
        # progress, cancellation, and the typed-failure surface) and compress_output_test.dart
        # (03-07: estimate()/clearCache()/output-placement, its whole-file Apple guard now
        # removed) on the concrete simulator resolved above, one `flutter test` process per
        # suite, via tool/run_ios_integration_suites.sh.
        #
        # The script exists because `flutter test -d <simulator>` hangs at launch on roughly
        # half of all attempts on the hosted runner: Flutter discovers the VM service by tailing
        # the simulator's unified log (`xcrun simctl spawn <udid> log stream`), that process dies,
        # the tool prints "No tests ran." / "Error waiting for a debug connection: The log reader
        # failed unexpectedly" and never exits (upstream flutter/flutter#116248, #77992). Every
        # Apple run since 03-04 landed has hit it at least once (35765529347, 35776724779,
        # 35799608545, 35807149965, 35809012150, 35812499597, 35821995638, 35826458554). The
        # previous inline watchdog judged "the app launched" by the log being longer than one
        # line, which Flutter's own build preamble satisfies instantly, so every hang burned the
        # full 600 s post-launch budget: run 35826458554 spent 48 of these 60 minutes on four
        # ~12-minute hangs and timed out before compress_audio_test.dart ran once. The script's
        # watchdog is phase-aware instead (build -> launch -> run, each with its own budget),
        # counts only real "MM:SS +N:" test-progress lines as proof of launch, kills an attempt
        # the moment the log-reader error appears, and retries a launch failure up to 8 times
        # from a fresh simulator boot; a suite that produced real test output before failing is
        # a genuine failure and fails fast with no retry. A hang now costs one incremental Xcode
        # build (~1-2 min) instead of ~12. `timeout-minutes: 90` stays as the outer backstop --
        # raised from 60 (03-07-PLAN.md task 2) once compress_output_test.dart became this
        # step's sixth suite: run 36168698223 measured the six-suite step absorbing 12 launch
        # hangs (~4-5 min apiece including rebuild and simulator reset) and exhausting the old
        # 60-minute budget before compress_audio_test.dart or compress_output_test.dart got a
        # turn, even though every suite that DID run was green. This raises the ceiling only --
        # it does not change the watchdog script's own per-suite/per-phase budgets.
        # tool/run_ios_integration_suites_test.sh replays all of these shapes against a fake
        # `flutter` and is the place to prove any change to the watchdog before pushing it.
        #
        # Split into two steps with disjoint suite subsets (04-01, D-16): hard_inputs_test.dart
        # (Phase 4's seventh suite) pushed the six-suite step close enough to its budget that
        # the instruction is to split suites across steps rather than raise any timeout again --
        # raising `timeout-minutes` a second time was explicitly rejected. Each step passes an
        # explicit suite subset (the script already accepts `$@` to override its own default
        # array) and gets its OWN `$LOG` path: the script truncates `$LOG` on start (`: > "$LOG"`),
        # so two invocations sharing one path would silently discard the first step's own
        # PARITY_JSON lines before the extraction step below ever runs.
        #
        # `timeout-minutes: 90` on BOTH split steps, not a smaller share of the original 90: CI
        # run 36219080189 measured part 1 (four suites) alone absorbing 11 launch hangs (~5 min
        # each, "no test output within 150s" -- see run_ios_integration_suites.sh's LAUNCH_BUDGET
        # comment) and timing out at a shrunk 60-minute budget with every suite that DID run
        # green. The split is for the SUITE COUNT per step, not a reason to shrink the per-step
        # backstop; the `apple` job's own 6-hour default ceiling is what actually bounds the
        # worst case across both steps.
        working-directory: example
        timeout-minutes: 90
        run: |
          LOG=/tmp/apple_integration.log bash ../tool/run_ios_integration_suites.sh \
            "${{ steps.ios_sim.outputs.udid }}" \
            integration_test/media_info_test.dart \
            integration_test/thumbnail_test.dart \
            integration_test/compress_test.dart \
            integration_test/compress_audio_test.dart

      - name: Run corpus integration tests on the iOS simulator (part 2)
        # Second disjoint subset (see the step above for the full rationale, including why this
        # step also keeps a full 90-minute budget): the remaining three suites, including
        # hard_inputs_test.dart, into their own log so both steps' PARITY_JSON lines survive to
        # the extraction step below.
        working-directory: example
        timeout-minutes: 90
        run: |
          LOG=/tmp/apple_integration_2.log bash ../tool/run_ios_integration_suites.sh \
            "${{ steps.ios_sim.outputs.udid }}" \
            integration_test/compress_jobs_test.dart \
            integration_test/compress_output_test.dart \
            integration_test/hard_inputs_test.dart

      - name: Extract cross-platform parity records (Apple)
        # Captures the PARITY_JSON lines media_info_test.dart/thumbnail_test.dart emitted above,
        # for the `parity` job (01-07) to diff against the same records from the `android` job.
        # Reads BOTH split logs (04-01, D-16/T-04-06): today only step 1's suites
        # (media_info_test.dart, thumbnail_test.dart) emit PARITY_JSON at all, so
        # apple_integration_2.log contributes nothing yet, but reading both means a future
        # plan (04-05 adds a PARITY_JSON emitter to hard_inputs_test.dart, which lives in step
        # 2) is picked up automatically instead of silently dropped because this step still
        # only looked at one log path.
        run: grep -h '^PARITY_JSON ' /tmp/apple_integration.log /tmp/apple_integration_2.log > /tmp/parity-apple.txt

      - name: Upload Apple parity artifact
        uses: actions/upload-artifact@v4
        with:
          name: parity-apple
          path: /tmp/parity-apple.txt

      - name: Measure presets on the iOS simulator (doc/PRESETS.md, 03-07-PLAN.md task 3)
        # tool/measure_presets.dart's own documented reproduction procedure (copy into
        # integration_test/, run, remove), automated here since the Mac build host is
        # frequently offline (QUESTIONS.md #8) -- this is the "measured, not assumed" Apple
        # section 03-RESEARCH.md Pitfall 8 requires, run separately from the macOS host step
        # below since the simulator's H.264 encoder is software while the macOS host has real
        # hardware encode.
        run: bash tool/measure_presets_ci.sh "${{ steps.ios_sim.outputs.udid }}" /tmp/measure-ios-simulator.txt

      - name: Upload iOS simulator preset measurements
        uses: actions/upload-artifact@v4
        with:
          name: measure-ios-simulator
          path: /tmp/measure-ios-simulator.txt

      - name: Build macOS
        working-directory: example
        run: |
          set -euo pipefail
          flutter build macos --debug || {
            echo "::warning::macOS build failed, likely the same CocoaPods sandbox/Podfile.lock mismatch as the iOS build. Clearing Pods state and retrying once."
            rm -rf macos/Pods macos/Podfile.lock macos/.symlinks
            flutter build macos --debug
          }

      - name: XCTest - macOS Runner
        working-directory: example/macos
        run: |
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -destination 'platform=macOS'

      - name: Run corpus integration tests on macOS (03-08, D-16/D-22)
        # The Flutter DESKTOP target, not the iOS Simulator -- exercises the SAME shared Swift
        # core (darwin/compress_video/Sources/compress_video/) that XCTest just ran above, this
        # time end-to-end through the full Pigeon/Dart stack, so any delta the `parity` job's
        # macOS-vs-iOS comparison finds below is a real bug (one shared core, D-22), never a
        # legitimate platform difference.
        #
        # CI run 36195780910 tried the obvious single invocation (`flutter test integration_test
        # -d macos`, one process covering all six suites) and it failed: the first suite
        # (compress_audio_test.dart) passed, then every remaining suite hit "Error waiting for a
        # debug connection: The log reader stopped unexpectedly, or never started." followed by
        # "Unable to start the app on the device." -- macOS's `open` re-activates the FIRST
        # suite's still-running app instance instead of launching a fresh one, so no new
        # VM-service port ever opens (flutter/flutter#101854, #118532). This is the macOS-desktop
        # flavour of the exact upstream launch flake tool/run_ios_integration_suites.sh already
        # survives for the iOS Simulator, so it now also drives the macOS runs: one `flutter
        # test <suite> -d macos` process per suite, a watchdog that classifies the shape above as
        # a retryable launch failure (not a genuine test failure), and -- the actual fix, since
        # this watchdog's own process-group kill cannot reach an app `open` already handed off to
        # launchd -- a `pkill` of any leftover app instance before every suite, not only after a
        # failed attempt. `timeout-minutes` is a backstop, not an expected budget: six suites of
        # real encodes on this runner's own Apple Silicon measured in single-digit minutes
        # locally, before this failure mode was found.
        #
        # Split into two steps with disjoint suite subsets (04-01, D-16), same rationale and
        # same log-truncation hazard as the iOS split above: hard_inputs_test.dart is the
        # seventh suite, split rather than raise `timeout-minutes` again, each step gets its
        # own `$LOG` path since the script truncates it on start.
        #
        # `timeout-minutes: 90` here too (CI run 36219080189): the split is for the suite count
        # per step, not a reason to shrink the per-step backstop, matching the iOS steps above
        # even though macOS suites normally finish in single-digit minutes -- the backstop only
        # matters on the rare run that needs it.
        working-directory: example
        timeout-minutes: 90
        run: |
          LOG=/tmp/macos_integration.log bash ../tool/run_ios_integration_suites.sh macos \
            integration_test/media_info_test.dart \
            integration_test/thumbnail_test.dart \
            integration_test/compress_test.dart \
            integration_test/compress_audio_test.dart

      - name: Run corpus integration tests on macOS (part 2)
        # Second disjoint subset (see the step above for the full rationale, including the
        # 90-minute budget): the remaining three suites, including hard_inputs_test.dart, into
        # their own log.
        working-directory: example
        timeout-minutes: 90
        run: |
          LOG=/tmp/macos_integration_2.log bash ../tool/run_ios_integration_suites.sh macos \
            integration_test/compress_jobs_test.dart \
            integration_test/compress_output_test.dart \
            integration_test/hard_inputs_test.dart

      - name: Extract cross-platform parity records (macOS)
        # Captures the PARITY_JSON lines the macOS runs above emitted, for the `parity` job
        # (03-08, D-22) to diff against the iOS simulator's own record from the same shared core.
        # Reads BOTH split logs (04-01, D-16/T-04-06) for the same forward-compatibility reason
        # as the Apple extraction step above.
        run: grep -h '^PARITY_JSON ' /tmp/macos_integration.log /tmp/macos_integration_2.log > /tmp/parity-macos.txt

      - name: Upload macOS parity artifact
        uses: actions/upload-artifact@v4
        with:
          name: parity-macos
          path: /tmp/parity-macos.txt

      - name: Measure presets on the macOS host (doc/PRESETS.md, 03-07-PLAN.md task 3)
        # Same procedure as the iOS simulator step above, run against the `macos` device --
        # this run has access to real Video Toolbox hardware encode on the runner's Apple
        # Silicon, unlike the iOS Simulator (03-RESEARCH.md Pitfall 8), so the two tables are
        # expected to differ and are published separately, never combined.
        run: bash tool/measure_presets_ci.sh macos /tmp/measure-macos-host.txt

      - name: Upload macOS host preset measurements
        uses: actions/upload-artifact@v4
        with:
          name: measure-macos-host
          path: /tmp/measure-macos-host.txt

      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager

      - name: Clean example (SPM proof)
        working-directory: example
        run: flutter clean

      - name: Build iOS via Swift Package Manager
        working-directory: example
        run: flutter build ios --simulator --no-codesign

      - name: Build macOS via Swift Package Manager (D-20)
        # D-20 requires both install paths to build BOTH Apple platforms in CI. The iOS SPM
        # build above proves one half; this proves macOS's own SPM path with the identical
        # Swift Package Manager configuration still enabled from the step above (no re-clean
        # needed -- Package.swift's dependency resolution is per-platform, not a leftover from
        # the iOS build).
        working-directory: example
        run: flutter build macos --debug

  parity:
    name: Cross-platform parity
    runs-on: ubuntu-latest
    needs: [changes, android, apple]
    # Runs whenever `android` succeeded, regardless of whether `apple` ran. The previous
    # condition (`needs.apple.result == 'success'`) let this whole job vanish into a silent
    # *skip* -- which GitHub branch protection can treat as passing, not as a warning -- any
    # time `apple` didn't run for any reason, including a future regression in the `changes`
    # filter (CR-01). The first step below turns "apple didn't run" into either an explicit,
    # justified no-op (genuinely no Apple-relevant change, confirmed independently against
    # the `changes` job's own output) or a loud failure, so this gate can never again be
    # bypassed by silence.
    if: ${{ !cancelled() && needs.android.result == 'success' }}
    steps:
      - id: gate
        name: Verify the Apple job's result before trusting its artifact
        run: |
          set -euo pipefail
          case "${{ needs.apple.result }}" in
            success)
              echo "proceed=true" >> "$GITHUB_OUTPUT"
              ;;
            skipped)
              if [ "${{ needs.changes.outputs.apple }}" = "true" ]; then
                echo "FATAL: the 'apple' job was skipped even though the 'changes' job flagged Apple-relevant paths as changed. This must never happen -- 'apple's own if-condition gates on that same output. Treat this as a workflow bug, not a pass." >&2
                exit 1
              fi
              echo "'apple' job correctly skipped (no Apple-relevant paths changed): nothing to diff."
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "FATAL: 'apple' job did not succeed (result=${{ needs.apple.result }}); parity cannot run without its artifact." >&2
              exit 1
              ;;
          esac

      - name: Checkout
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@v6

      - name: Self-test the parity gate against hand-written fixtures
        # Proves check_parity.sh itself before trusting it on the real artifacts below: a
        # within-tolerance fixture must pass and an out-of-tolerance one must fail and name the
        # differing field.
        if: steps.gate.outputs.proceed == 'true'
        run: bash tool/check_parity_test.sh

      - name: Download Android parity artifact
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: parity-android
          path: parity-artifacts/android

      - name: Download Apple parity artifact
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: parity-apple
          path: parity-artifacts/apple

      - name: Download macOS parity artifact
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: parity-macos
          path: parity-artifacts/macos

      - name: Diff cross-platform parity values (Android vs iOS)
        if: steps.gate.outputs.proceed == 'true'
        run: bash tool/check_parity.sh parity-artifacts/android/parity-android.txt parity-artifacts/apple/parity-apple.txt

      - name: Diff cross-platform parity values (macOS vs iOS)
        # macOS and iOS run the SAME shared Swift core (darwin/compress_video/Sources/
        # compress_video/) -- a delta here is a real bug, not a platform difference, so this
        # comparison runs at the identical strictness as the Android/iOS pair above (D-22).
        if: steps.gate.outputs.proceed == 'true'
        run: bash tool/check_parity.sh parity-artifacts/macos/parity-macos.txt parity-artifacts/apple/parity-apple.txt
