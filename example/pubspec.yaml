name: compress_video_example
description: "Demonstrates how to use the compress_video plugin."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ^3.12.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  compress_video:
    # When depending on this package from a real application you should use:
    #   compress_video: ^x.y.z
    # See https://dart.dev/tools/pub/dependencies#version-constraints
    # The example app is bundled with the plugin so we use a path dependency on
    # the parent directory to use the current plugin's version.
    path: ../

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Example-app-only dependencies for BULD-04's real picker -> compress -> play flow.
  # Versions verified live against pub.dev (publisher:flutter.dev) in 03-RESEARCH.md.
  image_picker: ^1.2.3
  video_player: ^2.14.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  # Used by compress_test.dart to assert the never-larger substitution's output is
  # byte-identical to the input via a digest comparison, not just a length comparison.
  crypto: ^3.0.6

  # Test-only: main_screen_test.dart fakes ImagePickerPlatform.instance (MockPlatformInterfaceMixin)
  # to fully control pick results -- pending, null, throw, and a synthetic 200-char filename for
  # the long-text backstop -- with no platform channel. Both are already transitive dependencies
  # of image_picker; declared explicitly here only because test code imports them directly.
  image_picker_platform_interface: ^2.11.1
  plugin_platform_interface: ^2.1.8

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # The compress_video corpus clips, mirrored from ../corpus/ by corpus/sync_to_example.sh.
  # Bundled so integration tests (and this demo screen) can read them via rootBundle without
  # depending on anything outside the app package.
  assets:
    - assets/corpus/portrait_rot90.mp4
    - assets/corpus/small_480p.mp4
    - assets/corpus/noaudio_720p.mp4
    - assets/corpus/portrait_rot90.expected.json
    - assets/corpus/small_480p.expected.json
    - assets/corpus/noaudio_720p.expected.json
    - assets/corpus/portrait_hibitrate_1080p60.mp4
    - assets/corpus/portrait_hibitrate_1080p60.expected.json
    - assets/corpus/truncated_mdat.mp4
    - assets/corpus/trim_source_10s.mp4
    - assets/corpus/trim_source_10s.expected.json
    - assets/corpus/hdr_hlg10.mp4
    - assets/corpus/hdr_hlg10.expected.json
    - assets/corpus/hdr_pq10.mp4
    - assets/corpus/hdr_pq10.expected.json
    - assets/corpus/pcm_audio_480p.mov
    - assets/corpus/pcm_audio_480p.expected.json
    - assets/corpus/surround51_480p.mp4
    - assets/corpus/surround51_480p.expected.json
    - assets/corpus/uhd_4k60.mp4
    - assets/corpus/uhd_4k60.expected.json

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
